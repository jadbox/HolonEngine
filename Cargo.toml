[workspace]
resolver = "3"
members = ["crates/cc_math", "crates/cc_field", "crates/cc_cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clifford = "0.3"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
